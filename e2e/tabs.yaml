# Maestro flow: the app opens on Play and every tab switches to its screen.
appId: app.tonup.ios
---
- launchApp:
    clearState: true
- assertVisible:
    id: 'quick-start'
- tapOn:
    id: 'tab-practice'
- assertVisible:
    id: 'drill-bobs27'
- tapOn:
    id: 'tab-history'
- assertVisible:
    id: 'open-analysis'
- tapOn:
    id: 'tab-rules'
- assertVisible:
    id: 'rules-search'
- tapOn:
    id: 'tab-settings'
- assertVisible:
    id: 'settings-appearance'
- tapOn:
    id: 'tab-play'
- assertVisible:
    id: 'quick-start'
